<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — AnalystPilot</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    :root {
        --bg: #0A0E1A; --surface: #131829; --primary: #7C5CFF; --cyan: #22D3EE;
        --mint: #34D399; --text: #E8ECF4; --muted: #8B95A8; --border: rgba(124,92,255,0.15);
    }
    body { background-color: var(--bg); color: var(--text); display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    
    .auth-box { width: 100%; max-width: 440px; padding: 40px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    
    .brand { display: flex; justify-content: center; align-items: center; gap: 10px; text-decoration: none; color: var(--text); margin-bottom: 30px; }
    .brand-text { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-text .accent { background: linear-gradient(90deg, var(--primary), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .icon-wrap { width: 56px; height: 56px; background: rgba(124,92,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 24px; }
    
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; text-align: center; letter-spacing: -0.5px; }
    p.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; text-align: center; line-height: 1.5; }
    
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .form-input {
        width: 100%; background: var(--bg); border: 1px solid var(--border);
        border-radius: 9px; padding: 12px 14px; color: var(--text);
        font-size: 14px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,92,255,0.15); }
    
    .btn-primary {
        width: 100%; padding: 12px; border-radius: 9px; font-size: 14px; font-weight: 600;
        background: linear-gradient(135deg, var(--primary), var(--cyan)); color: white;
        border: none; cursor: pointer; transition: all 0.2s;
        box-shadow: 0 4px 20px rgba(124,92,255,0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 26px rgba(124,92,255,0.5); transform: translateY(-1px); }
    
    .back-link { display: block; text-align: center; margin-top: 24px; font-size: 14px; color: var(--muted); text-decoration: none; font-weight: 500; }
    .back-link:hover { color: var(--cyan); }
</style>
</head>
<body>

    <div class="auth-box">
        <a href="/" class="brand">
            <svg width="32" height="32" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="lg" x1="0" y1="44" x2="44" y2="0">
                        <stop offset="0%" stop-color="#7C5CFF"/><stop offset="55%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#34D399"/>
                    </linearGradient>
                </defs>
                <rect x="1" y="1" width="42" height="42" rx="13" fill="url(#lg)" opacity="0.10"/>
                <rect x="1" y="1" width="42" height="42" rx="13" stroke="url(#lg)" stroke-width="1.6"/>
                <rect x="11" y="24" width="4" height="9" rx="1.5" fill="url(#lg)"/>
                <rect x="17" y="18" width="4" height="15" rx="1.5" fill="url(#lg)"/>
                <rect x="23" y="12" width="4" height="21" rx="1.5" fill="url(#lg)"/>
                <path d="M31 33 V15 H35.5 A5.5 5.5 0 0 1 35.5 26 H31" stroke="#E8ECF4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span class="brand-text">Analyst<span class="accent">Pilot</span></span>
        </a>

        <div class="icon-wrap">🔒</div>
        <h1>Forgot password?</h1>
        <p class="subtitle">No worries, we'll send you reset instructions.</p>

        <form onsubmit="event.preventDefault(); alert('Reset link sent to your email! (Backend required)');">
            <div class="form-group">
                <label class="form-label">Email address</label>
                <input type="email" class="form-input" placeholder="john@example.com" required>
            </div>

            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>

        <a href="/login" class="back-link">← Back to login</a>
    </div>

</body>
</html>
